# intervals.icu MCP endpoint — paste into the existing site's nginx location
# config (for doc-skibavv.ru that is nginx/conf.d/locations.conf, inside the
# 443 server block).
#
# This snippet belongs in the SITE's repository, not applied by hand on the
# server: the deploy runs `git pull`, so a hand-edit would either be overwritten
# or make the pull fail with a conflict.
#
# It deliberately contains no secret. The shared secret is the next path
# segment, checked by the MCP app itself, so this file is safe to commit.
# Public URL: https://<site-domain>/icu/<MCP_SECRET>/mcp

location /icu/ {
    # Resolve the upstream per request through Docker's embedded DNS instead of
    # at config load. With a literal hostname, nginx refuses to start when the
    # MCP container is down — which would take the whole site offline. Here a
    # stopped container only makes this one path return 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mcp_upstream "mcp-intervals:8000";

    # Strip the /icu/ prefix: the app serves its routes from the root.
    rewrite ^/icu/(.*)$ /$1 break;
    proxy_pass http://$mcp_upstream;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # MCP streams tool results as server-sent events. Buffering would hold them
    # until the response completed, so a long report would look like a hang.
    proxy_http_version 1.1;
    proxy_buffering off;

    # A weekly report fans out to several intervals.icu calls before replying;
    # the default 60s read timeout can cut that off.
    proxy_read_timeout 300s;

    # The request path carries the shared secret, so it must never be written to
    # the access log — anyone who could read the log would gain full access.
    access_log off;
}
